
name: THE HUDDLE – NFL Quellenrecherche

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: NFL-Ereignisse verbessern
        shell: bash
        run: |
          python - <<'PY'
          import calendar
          import re
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta
          from html import unescape
          from urllib.parse import urlencode

          import feedparser
          import requests

          SOURCES = {
              "Kronen Zeitung": "krone.at",
              "KURIER": "kurier.at",
              "kicker Deutschland": "kicker.de",
              "kicker Österreich": "kicker.at",
              "Sky Sport Austria": "skysportaustria.at",
              "LAOLA1": "laola1.at",
              "football-world.news": "football-world.news"
          }

          TEAMS = {
              "Cardinals": ["cardinals", "arizona cardinals"],
              "Falcons": ["falcons", "atlanta falcons"],
              "Ravens": ["ravens", "baltimore"],
              "Bills": ["bills", "buffalo bills"],
              "Panthers": ["panthers", "carolina panthers"],
              "Bears": ["bears", "chicago bears"],
              "Bengals": ["bengals", "cincinnati"],
              "Browns": ["browns", "cleveland browns"],
              "Cowboys": ["cowboys", "dallas"],
              "Broncos": ["broncos", "denver"],
              "Lions": ["lions", "detroit lions"],
              "Packers": ["packers", "green bay"],
              "Texans": ["texans", "houston texans"],
              "Colts": ["colts", "indianapolis"],
              "Jaguars": ["jaguars", "jacksonville"],
              "Chiefs": ["chiefs", "kansas city"],
              "Raiders": ["raiders", "las vegas raiders"],
              "Chargers": ["chargers", "l a chargers"],
              "Rams": ["rams", "l a rams"],
              "Dolphins": ["dolphins", "miami dolphins"],
              "Vikings": ["vikings", "minnesota vikings"],
              "Patriots": ["patriots", "new england"],
              "Saints": ["saints", "new orleans"],
              "Giants": ["giants", "new york giants"],
              "Jets": ["jets", "new york jets"],
              "Eagles": ["eagles", "philadelphia"],
              "Steelers": ["steelers", "pittsburgh steelers"],
              "49ers": ["49ers", "san francisco"],
              "Seahawks": ["seahawks", "seattle seahawks"],
              "Buccaneers": ["buccaneers", "bucs", "tampa bay"],
              "Titans": ["titans", "tennessee titans"],
              "Commanders": ["commanders", "washington commanders"]
          }

          PLAYERS = {
              "Bernhard Raimann": r"\braimann\w*\b",
              "Valentin Senn": r"\bvalentin\s+senn\b"
          }

          PLAYER_TEAMS = {
              "Bernhard Raimann": "Colts",
              "Valentin Senn": "Cardinals"
          }

          NFL_TERMS = [
              r"\bnfl\b",
              r"\bsuper[\s-]?bowl\b",
              r"\bamerican[\s-]?football\b",
              r"\bquarterback\b",
              r"\btouchdown\b",
              r"\bmahomes\b",
              r"\braimann\w*\b",
              r"\bvalentin\s+senn\b"
          ]

          OTHER_SPORTS = [
              r"\bnhl\b",
              r"\bnba\b",
              r"\bmls\b",
              r"\binter miami\b",
              r"\bmessi\b",
              r"\bkraken\b",
              r"\bflames\b",
              r"\bcanadiens\b",
              r"\bpenguins\b",
              r"\bwinnipeg jets\b",
              r"\bflorida panthers\b",
              r"\bbundesliga\b",
              r"\bchampions league\b",
              r"\bla liga\b",
              r"\bvar\b",
              r"\bdfb[\s-]?pokal\b"
          ]

          GAME_TERMS = [
              r"\bgewin\w*\b",
              r"\bverlier\w*\b",
              r"\bsieg\b",
              r"\bniederlage\b",
              r"\bpleite\b",
              r"\bschlagen\b",
              r"\bunterliegen\b",
              r"\bspielschema\b",
              r"\bhighlights?\b",
              r"\büberrollen\b",
              r"\bschocken\b",
              r"\bdominier\w*\b",
              r"\bcomeback\b",
              r"\bwende\b",
              r"\bkrimi\b",
              r"\bduell\b"
          ]

          NEWS_EVENTS = {
              "TRADE": [
                  r"\btrade\w*\b",
                  r"\btraden\b"
              ],
              "VERLETZUNG": [
                  r"\bverletz\w*\b",
                  r"\bausfall\b",
                  r"\bhiobsbotschaft\w*\b"
              ],
              "TRAINER": [
                  r"\btrainer\w*\b",
                  r"\bcoach\w*\b",
                  r"\bentlass\w*\b"
              ],
              "VERTRAG": [
                  r"\bvertrag\w*\b",
                  r"\bverlänger\w*\b"
              ]
          }

          NOW = datetime.now(timezone.utc)
          MAX_AGE = timedelta(hours=72)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def clean(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def normalize(value):
              value = clean(value).lower()
              value = re.sub(
                  r"[^a-zäöüß0-9]+", " ", value
              )
              return re.sub(r"\s+", " ", value).strip()

          def matches(patterns, text):
              return any(
                  re.search(pattern, text)
                  for pattern in patterns
              )

          def detect_teams(title):
              text = normalize(title)
              found = []

              for team, aliases in TEAMS.items():
                  if any(
                      re.search(
                          r"\b" + re.escape(alias) + r"\b",
                          text
                      )
                      for alias in aliases
                  ):
                      found.append(team)

              return sorted(set(found))

          def detect_players(title):
              text = normalize(title)

              return [
                  name
                  for name, pattern in PLAYERS.items()
                  if re.search(pattern, text)
              ]

          def is_nfl(title):
              text = normalize(title)

              if matches(OTHER_SPORTS, text):
                  return False

              return bool(
                  detect_teams(title)
                  or detect_players(title)
                  or matches(NFL_TERMS, text)
              )

          def detect_event(title):
              text = normalize(title)

              for event, patterns in NEWS_EVENTS.items():
                  if matches(patterns, text):
                      return event

              if matches(GAME_TERMS, text):
                  return "SPIEL"

              return "SONSTIGES"

          def content_type(title):
              text = normalize(title)

              if re.search(
                  r"\b(spielschema|spielinfo|spielerprofil)\b",
                  text
              ):
                  return "DATENSEITE"

              if re.search(
                  r"\b(video|highlights?)\b",
                  text
              ):
                  return "VIDEO"

              if re.search(
                  r"\b(warum|vorschau|preview|"
                  r"vor dem spiel)\b",
                  text
              ):
                  return "ANALYSE/VORSCHAU"

              return "ARTIKEL"

          articles = []
          rejected = []
          article_id = 0

          for source, domain in SOURCES.items():
              print(f"\n===== {source} =====", flush=True)

              query = (
                  '("NFL" OR "Super Bowl" OR '
                  '"Bernhard Raimann" OR "Valentin Senn") '
                  f"site:{domain} when:3d"
              )

              url = (
                  "https://news.google.com/rss/search?"
                  + urlencode({
                      "q": query,
                      "hl": "de",
                      "gl": "AT",
                      "ceid": "AT:de"
                  })
              )

              try:
                  response = session.get(url, timeout=25)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()
                  feed = feedparser.parse(response.content)
              except requests.RequestException as exc:
                  print("Abruffehler:", exc)
                  continue

              accepted = 0

              for entry in feed.entries:
                  parsed = entry.get("published_parsed")

                  if not parsed:
                      continue

                  published = datetime.fromtimestamp(
                      calendar.timegm(parsed),
                      timezone.utc
                  )

                  age = NOW - published

                  if age < timedelta(0) or age > MAX_AGE:
                      continue

                  title = clean(entry.get("title", ""))
                  link = entry.get("link", "")

                  if not title or not link:
                      continue

                  if not is_nfl(title):
                      rejected.append(title)
                      continue

                  article_id += 1
                  accepted += 1

                  article = {
                      "id": str(article_id),
                      "source": source,
                      "title": title,
                      "date": published,
                      "link": link,
                      "teams": detect_teams(title),
                      "players": detect_players(title),
                      "event": detect_event(title),
                      "type": content_type(title)
                  }

                  articles.append(article)

              print("Suchergebnisse:", len(feed.entries))
              print("NFL-Kandidaten:", accepted)

          # Spielkontext nur aus explizit erkannten
          # Paarungen mit zwei Teams ableiten.
          game_pairs = defaultdict(list)

          for article in articles:
              if (
                  article["event"] == "SPIEL"
                  and len(article["teams"]) == 2
              ):
                  pair = tuple(article["teams"])
                  game_pairs[pair].append(article)

          # Eindeutige Paarung eines Teams suchen.
          # Mehrere mögliche Paarungen bleiben ungeklärt.
          def find_game_pair(article):
              teams = set(article["teams"])

              for player in article["players"]:
                  team = PLAYER_TEAMS.get(player)
                  if team:
                      teams.add(team)

              if len(teams) == 2:
                  pair = tuple(sorted(teams))
                  if pair in game_pairs:
                      return pair

              if len(teams) != 1:
                  return None

              team = next(iter(teams))

              candidates = [
                  pair
                  for pair in game_pairs
                  if team in pair
              ]

              if len(candidates) == 1:
                  return candidates[0]

              return None

          groups = defaultdict(list)

          for article in articles:
              pair = None

              if article["event"] == "SPIEL":
                  pair = find_game_pair(article)

              if pair:
                  key = "SPIEL:" + ":".join(pair)

              elif article["players"]:
                  key = (
                      "AUSTRIAN:"
                      + ":".join(article["players"])
                      + ":"
                      + article["event"]
                  )

              elif (
                  article["event"] != "SONSTIGES"
                  and len(article["teams"]) == 1
              ):
                  key = (
                      article["event"]
                      + ":"
                      + article["teams"][0]
                  )

              else:
                  key = "EINZEL:" + article["id"]

              groups[key].append(article)

          sorted_groups = sorted(
              groups.items(),
              key=lambda pair: max(
                  item["date"] for item in pair[1]
              ),
              reverse=True
          )

          print(
              "\n===== EREIGNISCLUSTER: "
              + str(len(sorted_groups))
              + " ====="
          )

          for key, items in sorted_groups:
              items.sort(
                  key=lambda item: item["date"],
                  reverse=True
              )

              print("\n--------------------")
              print("Ereignis:", key)
              print("Artikel:", len(items))
              print(
                  "Quellen:",
                  ", ".join(sorted(set(
                      item["source"] for item in items
                  )))
              )

              players = sorted(set(
                  player
                  for item in items
                  for player in item["players"]
              ))

              if players:
                  print(
                      "Austrian Watch:",
                      ", ".join(players)
                  )

              types = defaultdict(int)

              for item in items:
                  types[item["type"]] += 1

              print(
                  "Inhaltstypen:",
                  ", ".join(
                      f"{kind}: {count}"
                      for kind, count in sorted(types.items())
                  )
              )

              for item in items[:6]:
                  print(" -", item["title"])

          print("\n===== FILTERKONTROLLE =====")

          for title in rejected[:20]:
              print("AUSSORTIERT:", title)

          print(
              "\nGesamtzahl NFL-Kandidaten:",
              len(articles)
          )
          print("Ereigniscluster:", len(groups))
          print("Aussortierte Treffer:", len(rejected))
          print("\nEreignistest 50H abgeschlossen.")
          PY
