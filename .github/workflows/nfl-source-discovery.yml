
name: THE HUDDLE – NFL Quellenrecherche

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: NFL-Ereignisse erkennen
        shell: bash
        run: |
          python - <<'PY'
          import calendar
          import re
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta
          from html import unescape
          from urllib.parse import urlencode

          import feedparser
          import requests

          SOURCES = {
              "Kronen Zeitung": "krone.at",
              "KURIER": "kurier.at",
              "kicker Deutschland": "kicker.de",
              "kicker Österreich": "kicker.at",
              "Sky Sport Austria": "skysportaustria.at",
              "LAOLA1": "laola1.at",
              "football-world.news": "football-world.news"
          }

          TEAMS = {
              "Cardinals": ["cardinals", "arizona"],
              "Falcons": ["falcons", "atlanta"],
              "Ravens": ["ravens", "baltimore"],
              "Bills": ["bills", "buffalo"],
              "Panthers": ["panthers", "carolina"],
              "Bears": ["bears", "chicago"],
              "Bengals": ["bengals", "cincinnati"],
              "Browns": ["browns", "cleveland"],
              "Cowboys": ["cowboys", "dallas"],
              "Broncos": ["broncos", "denver"],
              "Lions": ["lions", "detroit"],
              "Packers": ["packers", "green bay"],
              "Texans": ["texans", "houston"],
              "Colts": ["colts", "indianapolis"],
              "Jaguars": ["jaguars", "jacksonville"],
              "Chiefs": ["chiefs", "kansas city"],
              "Raiders": ["raiders", "las vegas"],
              "Chargers": ["chargers", "l a chargers"],
              "Rams": ["rams", "l a rams"],
              "Dolphins": ["dolphins", "miami"],
              "Vikings": ["vikings", "minnesota"],
              "Patriots": ["patriots", "new england"],
              "Saints": ["saints", "new orleans"],
              "Giants": ["giants", "new york giants"],
              "Jets": ["jets", "new york jets"],
              "Eagles": ["eagles", "philadelphia"],
              "Steelers": ["steelers", "pittsburgh"],
              "49ers": ["49ers", "san francisco"],
              "Seahawks": ["seahawks", "seattle"],
              "Buccaneers": ["buccaneers", "bucs", "tampa bay"],
              "Titans": ["titans", "tennessee"],
              "Commanders": ["commanders", "washington"]
          }

          PLAYERS = {
              "Bernhard Raimann": r"\braimann\w*\b",
              "Valentin Senn": r"\bvalentin\s+senn\b"
          }

          EVENTS = {
              "TRADE": [
                  r"\btrade\w*\b",
                  r"\btraden\b"
              ],
              "VERLETZUNG": [
                  r"\bverletz\w*\b",
                  r"\bausfall\b",
                  r"\bhiobsbotschaft\w*\b"
              ],
              "TRAINER": [
                  r"\btrainerwechsel\b",
                  r"\bcoach\b",
                  r"\bentlass\w*\b"
              ],
              "VERTRAG": [
                  r"\bvertrag\w*\b",
                  r"\bverlänger\w*\b"
              ],
              "SPIEL": [
                  r"\bgewin\w*\b",
                  r"\bverlier\w*\b",
                  r"\bsieg\b",
                  r"\bniederlage\b",
                  r"\bpleite\b",
                  r"\bschlagen\b",
                  r"\bunterliegen\b",
                  r"\bspielschema\b",
                  r"\bhighlights?\b",
                  r"\büberrollen\b",
                  r"\bschocken\b",
                  r"\bdominier\w*\b"
              ]
          }

          NFL_TERMS = [
              r"\bnfl\b",
              r"\bsuper[\s-]?bowl\b",
              r"\bamerican[\s-]?football\b",
              r"\bquarterback\b",
              r"\btouchdown\b",
              r"\bmahomes\b",
              r"\braimann\w*\b",
              r"\bvalentin\s+senn\b"
          ]

          EXCLUDE = [
              r"\bnba\b",
              r"\bnhl\b",
              r"\bla liga\b",
              r"\bbundesliga\b",
              r"\bchampions league\b",
              r"\bdfb[\s-]?pokal\b"
          ]

          NOW = datetime.now(timezone.utc)
          MAX_AGE = timedelta(hours=72)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def clean(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def normalize(value):
              value = clean(value).lower()
              value = re.sub(
                  r"[^a-zäöüß0-9]+", " ", value
              )
              return re.sub(
                  r"\s+", " ", value
              ).strip()

          def matches(patterns, text):
              return any(
                  re.search(pattern, text)
                  for pattern in patterns
              )

          def detect_teams(title):
              text = normalize(title)
              found = []

              for team, aliases in TEAMS.items():
                  if any(
                      re.search(
                          r"\b" + re.escape(alias) + r"\b",
                          text
                      )
                      for alias in aliases
                  ):
                      found.append(team)

              return sorted(set(found))

          def detect_players(title):
              text = normalize(title)

              return [
                  name
                  for name, pattern in PLAYERS.items()
                  if re.search(pattern, text)
              ]

          def detect_event(title):
              text = normalize(title)

              for event in [
                  "TRADE",
                  "VERLETZUNG",
                  "TRAINER",
                  "VERTRAG",
                  "SPIEL"
              ]:
                  if matches(EVENTS[event], text):
                      return event

              return "SONSTIGES"

          def is_nfl(title):
              text = normalize(title)

              if matches(EXCLUDE, text):
                  return False

              if detect_teams(title):
                  return True

              return matches(NFL_TERMS, text)

          def event_key(article):
              teams = article["teams"]
              event = article["event"]
              players = article["players"]

              # Zwei Teams + Spielereignis:
              # gleicher Match-Kontext.
              if event == "SPIEL" and len(teams) == 2:
                  return (
                      "SPIEL:"
                      + ":".join(teams)
                  )

              # Österreichischer Spieler:
              # vorläufig ein eigener Themenbereich.
              if players:
                  return (
                      "AUSTRIAN:"
                      + ":".join(players)
                      + ":"
                      + event
                  )

              # Teambezogene Nachrichten:
              # Ereignistyp und Team.
              if len(teams) == 1 and event != "SONSTIGES":
                  return event + ":" + teams[0]

              # Sonstige Nachrichten bleiben einzeln.
              return "EINZEL:" + article["id"]

          articles = []
          article_id = 0

          for source, domain in SOURCES.items():
              print(f"\n===== {source} =====", flush=True)

              query = (
                  '("NFL" OR "Super Bowl" OR '
                  '"Bernhard Raimann" OR "Valentin Senn") '
                  f"site:{domain} when:3d"
              )

              url = (
                  "https://news.google.com/rss/search?"
                  + urlencode({
                      "q": query,
                      "hl": "de",
                      "gl": "AT",
                      "ceid": "AT:de"
                  })
              )

              try:
                  response = session.get(url, timeout=25)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()
                  feed = feedparser.parse(response.content)
              except requests.RequestException as exc:
                  print("Abruffehler:", exc)
                  continue

              accepted = 0

              for entry in feed.entries:
                  parsed = entry.get("published_parsed")

                  if not parsed:
                      continue

                  published = datetime.fromtimestamp(
                      calendar.timegm(parsed),
                      timezone.utc
                  )

                  age = NOW - published

                  if age < timedelta(0) or age > MAX_AGE:
                      continue

                  title = clean(entry.get("title", ""))
                  link = entry.get("link", "")

                  if not title or not link:
                      continue

                  if not is_nfl(title):
                      continue

                  article_id += 1
                  accepted += 1

                  article = {
                      "id": str(article_id),
                      "source": source,
                      "title": title,
                      "date": published,
                      "link": link,
                      "teams": detect_teams(title),
                      "players": detect_players(title),
                      "event": detect_event(title)
                  }

                  article["key"] = event_key(article)
                  articles.append(article)

              print("Suchergebnisse:", len(feed.entries))
              print("NFL-Kandidaten:", accepted)

          groups = defaultdict(list)

          for article in articles:
              groups[article["key"]].append(article)

          sorted_groups = sorted(
              groups.items(),
              key=lambda pair: max(
                  item["date"] for item in pair[1]
              ),
              reverse=True
          )

          print(
              "\n===== EREIGNISCLUSTER: "
              + str(len(sorted_groups))
              + " ====="
          )

          for key, items in sorted_groups:
              items.sort(
                  key=lambda item: item["date"],
                  reverse=True
              )

              print("\n--------------------")
              print("Ereignis:", key)
              print("Artikel:", len(items))

              sources = sorted(set(
                  item["source"] for item in items
              ))

              print("Quellen:", ", ".join(sources))

              players = sorted(set(
                  player
                  for item in items
                  for player in item["players"]
              ))

              if players:
                  print(
                      "Austrian Watch:",
                      ", ".join(players)
                  )

              for item in items[:5]:
                  print(" -", item["title"])

          print(
              "\nGesamtzahl NFL-Kandidaten:",
              len(articles)
          )
          print(
              "Ereigniscluster:",
              len(groups)
          )
          print("\nEreignistest abgeschlossen.")
          PY
