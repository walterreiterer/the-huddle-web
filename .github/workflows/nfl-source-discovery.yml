
name: THE HUDDLE – NFL Quellenrecherche

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: NFL-Nachrichten redaktionell sortieren
        shell: bash
        run: |
          python - <<'PY'
          import calendar
          import re
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from html import unescape
          from urllib.parse import urlencode

          import feedparser
          import requests

          SOURCES = {
              "Kronen Zeitung": "krone.at",
              "KURIER": "kurier.at",
              "kicker Deutschland": "kicker.de",
              "kicker Österreich": "kicker.at",
              "Sky Sport Austria": "skysportaustria.at",
              "LAOLA1": "laola1.at",
              "football-world.news": "football-world.news"
          }

          SEARCH = (
              '("NFL" OR "Super Bowl" OR '
              '"Bernhard Raimann" OR "Valentin Senn")'
          )

          PLAYER_PATTERNS = {
              "Bernhard Raimann": r"\braimann\w*\b",
              "Valentin Senn": r"\bvalentin\s+senn\b"
          }

          NFL_PATTERNS = [
              r"\bnfl\b", r"\bsuper[\s-]?bowl\b",
              r"\bamerican[\s-]?football\b",
              r"\bcolts\b", r"\bchiefs\b",
              r"\bseahawks\b", r"\bpackers\b",
              r"\b49ers\b", r"\bpatriots\b",
              r"\bquarterback\b", r"\btouchdown\b",
              r"\bmahomes\b", r"\braimann\w*\b",
              r"\bvalentin\s+senn\b",
              r"\bjaguars\b", r"\bravens\b",
              r"\bbroncos\b", r"\beagles\b",
              r"\braiders\b", r"\bvikings\b",
              r"\bcowboys\b", r"\bbills\b",
              r"\brams\b", r"\bchargers\b",
              r"\blions\b", r"\bsteelers\b"
          ]

          EXCLUDE = [
              r"\bnba\b", r"\bnhl\b",
              r"\bla liga\b", r"\bbundesliga\b",
              r"\bchampions league\b",
              r"\bdfb[\s-]?pokal\b",
              r"\bmatch[\s-]?clip\b"
          ]

          GAME_PATTERNS = [
              r"\bgewin\w*\b", r"\bverlier\w*\b",
              r"\bsieg\b", r"\bniederlage\b",
              r"\bpleite\b", r"\bhighlights?\b",
              r"\bspielbericht\b", r"\bspielschema\b",
              r"\bspielinfo\b", r"\bduell\b",
              r"\bgegen\b", r"\bschlagen\b",
              r"\bunterliegen\b"
          ]

          TOP_PATTERNS = [
              r"\btrade\w*\b", r"\bverletz\w*\b",
              r"\bentlass\w*\b", r"\bvertrag\w*\b",
              r"\bwechsel\b", r"\brekord\w*\b",
              r"\bsperre\b", r"\bskandal\b",
              r"\btrainer\w*\b", r"\bcoach\w*\b",
              r"\bdraft\b", r"\bentscheidung\b"
          ]

          NOW = datetime.now(timezone.utc)
          MAX_AGE = timedelta(hours=72)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          articles = []

          def clean(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def normalize(value):
              value = clean(value).lower()
              value = re.sub(r"[^a-zäöüß0-9 ]", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def matches(patterns, text):
              return any(
                  re.search(pattern, text)
                  for pattern in patterns
              )

          def classify(title):
              text = title.lower()

              players = [
                  name for name, pattern
                  in PLAYER_PATTERNS.items()
                  if re.search(pattern, text)
              ]

              if players:
                  return "AUSTRIAN WATCH", players

              if matches(TOP_PATTERNS, text):
                  return "TOP STORIES", []

              if matches(GAME_PATTERNS, text):
                  return "SPIELBERICHTE", []

              return "WEITERE NFL-MELDUNGEN", []

          for source, domain in SOURCES.items():
              query = f"{SEARCH} site:{domain} when:3d"
              url = (
                  "https://news.google.com/rss/search?"
                  + urlencode({
                      "q": query,
                      "hl": "de",
                      "gl": "AT",
                      "ceid": "AT:de"
                  })
              )

              print(f"\n===== {source} =====", flush=True)

              try:
                  response = session.get(url, timeout=25)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()
                  feed = feedparser.parse(response.content)
              except requests.RequestException as exc:
                  print("Abruffehler:", exc)
                  continue

              accepted = 0

              for entry in feed.entries:
                  parsed = entry.get("published_parsed")

                  if not parsed:
                      continue

                  published = datetime.fromtimestamp(
                      calendar.timegm(parsed),
                      timezone.utc
                  )

                  age = NOW - published

                  if age < timedelta(0) or age > MAX_AGE:
                      continue

                  title = clean(entry.get("title", ""))
                  link = entry.get("link", "")

                  if not title or not link:
                      continue

                  text = title.lower()

                  if matches(EXCLUDE, text):
                      continue

                  if not matches(NFL_PATTERNS, text):
                      continue

                  category, players = classify(title)

                  articles.append({
                      "source": source,
                      "title": title,
                      "date": published,
                      "link": link,
                      "category": category,
                      "players": players
                  })

                  accepted += 1

              print("Suchergebnisse:", len(feed.entries))
              print("NFL-Kandidaten:", accepted)

          articles.sort(
              key=lambda item: item["date"],
              reverse=True
          )

          # Erste Gruppierung ähnlicher Überschriften.
          # Keine Meldung wird dabei gelöscht.
          groups = []

          for article in articles:
              title = normalize(article["title"])

              # Mediennamen am Titelende entfernen.
              title = re.sub(
                  r"\s+(kicker|sky sport austria|"
                  r"kronen zeitung|laola1|"
                  r"football world news)$",
                  "",
                  title
              )

              matched_group = None

              for group in groups:
                  if group["category"] != article["category"]:
                      continue

                  representative = normalize(
                      group["items"][0]["title"]
                  )

                  similarity = SequenceMatcher(
                      None, title, representative
                  ).ratio()

                  if similarity >= 0.72:
                      matched_group = group
                      break

              if matched_group is None:
                  groups.append({
                      "category": article["category"],
                      "items": [article]
                  })
              else:
                  matched_group["items"].append(article)

          CATEGORIES = [
              "AUSTRIAN WATCH",
              "TOP STORIES",
              "SPIELBERICHTE",
              "WEITERE NFL-MELDUNGEN"
          ]

          for category in CATEGORIES:
              selected = [
                  group for group in groups
                  if group["category"] == category
              ]

              print(
                  f"\n===== {category}: "
                  f"{len(selected)} THEMEN ====="
              )

              for group in selected[:25]:
                  primary = group["items"][0]

                  print("--------------------")
                  print("Thema:", primary["title"])
                  print(
                      "Datum:",
                      primary["date"].strftime(
                          "%d.%m.%Y %H:%M UTC"
                      )
                  )
                  print(
                      "Quellen:",
                      ", ".join(
                          sorted(set(
                              item["source"]
                              for item in group["items"]
                          ))
                      )
                  )
                  print(
                      "Artikel im Themencluster:",
                      len(group["items"])
                  )
                  print(
                      "Google-News-Link:",
                      primary["link"]
                  )

          print(
              "\nGesamtzahl NFL-Kandidaten:",
              len(articles)
          )
          print("Themencluster:", len(groups))
          print("\nRedaktionstest abgeschlossen.")
          PY
