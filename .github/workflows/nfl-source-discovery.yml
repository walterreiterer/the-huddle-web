
name: THE HUDDLE – NFL Quellenrecherche

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: Redaktionstest 50I
        shell: bash
        run: |
          python - <<'PY'
          import calendar
          import re
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher
          from html import unescape
          from urllib.parse import urlencode

          import feedparser
          import requests

          SOURCES = {
              "Kronen Zeitung": "krone.at",
              "KURIER": "kurier.at",
              "kicker Deutschland": "kicker.de",
              "kicker Österreich": "kicker.at",
              "Sky Sport Austria": "skysportaustria.at",
              "LAOLA1": "laola1.at",
              "football-world.news": "football-world.news"
          }

          TEAMS = {
              "Cardinals": ["cardinals", "arizona cardinals"],
              "Falcons": ["falcons", "atlanta falcons"],
              "Ravens": ["ravens", "baltimore ravens"],
              "Bills": ["bills", "buffalo bills"],
              "Panthers": ["carolina panthers"],
              "Bears": ["bears", "chicago bears"],
              "Bengals": ["bengals", "cincinnati"],
              "Browns": ["browns", "cleveland browns"],
              "Cowboys": ["cowboys", "dallas cowboys"],
              "Broncos": ["broncos", "denver"],
              "Lions": ["lions", "detroit lions"],
              "Packers": ["packers", "green bay"],
              "Texans": ["texans", "houston texans"],
              "Colts": ["colts", "indianapolis"],
              "Jaguars": ["jaguars", "jacksonville"],
              "Chiefs": ["chiefs", "kansas city"],
              "Raiders": ["raiders", "las vegas raiders"],
              "Chargers": ["chargers", "l a chargers"],
              "Rams": ["rams", "l a rams"],
              "Dolphins": ["dolphins", "miami dolphins"],
              "Vikings": ["vikings", "minnesota vikings"],
              "Patriots": ["patriots", "new england"],
              "Saints": ["saints", "new orleans"],
              "Giants": ["new york giants"],
              "Jets": ["new york jets", "jets"],
              "Eagles": ["eagles", "philadelphia"],
              "Steelers": ["steelers", "pittsburgh steelers"],
              "49ers": ["49ers", "san francisco"],
              "Seahawks": ["seahawks", "seattle seahawks"],
              "Buccaneers": ["buccaneers", "bucs", "tampa bay"],
              "Titans": ["titans", "tennessee titans"],
              "Commanders": ["commanders", "washington commanders"]
          }

          PLAYERS = {
              "Bernhard Raimann": r"\braimann\w*\b",
              "Valentin Senn": r"\bvalentin\s+senn\b"
          }

          PLAYER_TEAMS = {
              "Bernhard Raimann": "Colts",
              "Valentin Senn": "Cardinals"
          }

          OTHER_SPORTS = [
              r"\bnhl\b", r"\bnba\b", r"\bmls\b",
              r"\binter miami\b", r"\bmessi\b",
              r"\bkraken\b", r"\bflames\b",
              r"\bcanadiens\b", r"\bpenguins\b",
              r"\bwinnipeg jets\b",
              r"\bflorida panthers\b",
              r"\bbundesliga\b",
              r"\bchampions league\b",
              r"\bla liga\b",
              r"\bserie a\b",
              r"\bligue 1\b",
              r"\bdfb[\s-]?pokal\b"
          ]

          NFL_TERMS = [
              r"\bnfl\b",
              r"\bsuper[\s-]?bowl\b",
              r"\bamerican[\s-]?football\b",
              r"\bquarterback\b",
              r"\btouchdown\b",
              r"\bmahomes\b",
              r"\braimann\w*\b",
              r"\bvalentin\s+senn\b"
          ]

          GAME_TERMS = [
              r"\bgewin\w*\b",
              r"\bverlier\w*\b",
              r"\bsieg\b",
              r"\bniederlage\b",
              r"\bpleite\b",
              r"\bschlagen\b",
              r"\bunterliegen\b",
              r"\büberrollen\b",
              r"\bschocken\b",
              r"\bdominier\w*\b",
              r"\bcomeback\b",
              r"\bwende\b",
              r"\bkrimi\b"
          ]

          NEWS_EVENTS = {
              "TRADE": [
                  r"\btrade\w*\b",
                  r"\btraden\b"
              ],
              "VERLETZUNG": [
                  r"\bverletz\w*\b",
                  r"\bausfall\b",
                  r"\bhiobsbotschaft\w*\b"
              ],
              "TRAINER": [
                  r"\btrainerwechsel\b",
                  r"\bcoachwechsel\b",
                  r"\bentlass\w*\b"
              ],
              "VERTRAG": [
                  r"\bvertrag\w*\b",
                  r"\bverlänger\w*\b"
              ]
          }

          NOW = datetime.now(timezone.utc)
          MAX_AGE = timedelta(hours=72)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          def clean(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def normalize(value):
              value = clean(value).lower()
              value = re.sub(
                  r"[^a-zäöüß0-9]+", " ", value
              )
              return re.sub(r"\s+", " ", value).strip()

          def matches(patterns, text):
              return any(
                  re.search(pattern, text)
                  for pattern in patterns
              )

          def detect_teams(title):
              text = normalize(title)
              found = []

              for team, aliases in TEAMS.items():
                  if any(
                      re.search(
                          r"\b" + re.escape(alias) + r"\b",
                          text
                      )
                      for alias in aliases
                  ):
                      found.append(team)

              return sorted(set(found))

          def detect_players(title):
              text = normalize(title)
              return [
                  name
                  for name, pattern in PLAYERS.items()
                  if re.search(pattern, text)
              ]

          def is_nfl(title):
              text = normalize(title)

              if matches(OTHER_SPORTS, text):
                  return False

              return bool(
                  detect_teams(title)
                  or detect_players(title)
                  or matches(NFL_TERMS, text)
              )

          def content_type(title):
              text = normalize(title)

              if matches([
                  r"\bspielschema\b",
                  r"\bspielinfo\b",
                  r"\bspielerprofil\b"
              ], text):
                  return "DATENSEITE"

              if matches([
                  r"\bvideo\b",
                  r"\bhighlights?\b"
              ], text):
                  return "VIDEO"

              if matches([
                  r"\bvorschau\b",
                  r"\bpreview\b",
                  r"\bwarum\b",
                  r"\bvor dem spiel\b"
              ], text):
                  return "ANALYSE/VORSCHAU"

              return "ARTIKEL"

          def detect_event(title, kind):
              text = normalize(title)

              for event, patterns in NEWS_EVENTS.items():
                  if matches(patterns, text):
                      return event

              if kind == "DATENSEITE":
                  return "DATEN"

              if kind == "VIDEO":
                  return "VIDEO"

              if matches(GAME_TERMS, text):
                  return "SPIEL"

              return "SONSTIGES"

          def headline_key(title):
              title = clean(title)

              # Medienbezeichnung am Ende entfernen.
              title = re.sub(
                  r"\s*[-|]\s*(?:Kicker|"
                  r"Sky Sport Austria|"
                  r"Kronen Zeitung|LAOLA1|"
                  r"football-world\s*\|\s*News)"
                  r"\s*$",
                  "",
                  title,
                  flags=re.I
              )

              return normalize(title)

          articles = []
          rejected = []

          for source, domain in SOURCES.items():
              print(f"\n===== {source} =====", flush=True)

              query = (
                  '("NFL" OR "Super Bowl" OR '
                  '"Bernhard Raimann" OR "Valentin Senn") '
                  f"site:{domain} when:3d"
              )

              url = (
                  "https://news.google.com/rss/search?"
                  + urlencode({
                      "q": query,
                      "hl": "de",
                      "gl": "AT",
                      "ceid": "AT:de"
                  })
              )

              try:
                  response = session.get(url, timeout=25)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()
                  feed = feedparser.parse(response.content)
              except requests.RequestException as exc:
                  print("Abruffehler:", exc)
                  continue

              accepted = 0

              for entry in feed.entries:
                  parsed = entry.get("published_parsed")

                  if not parsed:
                      continue

                  published = datetime.fromtimestamp(
                      calendar.timegm(parsed),
                      timezone.utc
                  )

                  age = NOW - published

                  if age < timedelta(0) or age > MAX_AGE:
                      continue

                  title = clean(entry.get("title", ""))
                  link = entry.get("link", "")

                  if not title or not link:
                      continue

                  if not is_nfl(title):
                      rejected.append(title)
                      continue

                  kind = content_type(title)

                  article = {
                      "id": str(len(articles) + 1),
                      "source": source,
                      "title": title,
                      "date": published,
                      "link": link,
                      "teams": detect_teams(title),
                      "players": detect_players(title),
                      "type": kind,
                      "event": detect_event(title, kind),
                      "headline_key": headline_key(title)
                  }

                  articles.append(article)
                  accepted += 1

              print("NFL-Kandidaten:", accepted)

          # 1. Exakte Schlagzeilen-Dubletten.
          # Jede Variante bleibt als Quelle erhalten.
          unique = []
          duplicates = defaultdict(list)
          by_headline = {}

          for article in sorted(
              articles,
              key=lambda x: x["date"],
              reverse=True
          ):
              key = (
                  article["headline_key"],
                  article["type"]
              )

              if key in by_headline:
                  duplicates[key].append(article)
              else:
                  by_headline[key] = article
                  unique.append(article)

          # 2. Spielpaarungen ausschließlich aus
          # Überschriften mit zwei erkannten Teams.
          game_pairs = defaultdict(list)

          for article in unique:
              if (
                  len(article["teams"]) == 2
                  and article["event"] in [
                      "SPIEL", "VIDEO", "DATEN"
                  ]
              ):
                  pair = tuple(article["teams"])
                  game_pairs[pair].append(article)

          def find_game_pair(article):
              teams = set(article["teams"])

              if len(teams) == 2:
                  pair = tuple(sorted(teams))
                  if pair in game_pairs:
                      return pair

              # Kein genereller Rückschluss von
              # einem Team auf einen Gegner!
              # Ausnahme nur für Austrian Watch.
              if (
                  len(teams) == 1
                  and article["players"]
                  and article["event"] == "SPIEL"
              ):
                  team = next(iter(teams))

                  if any(
                      PLAYER_TEAMS.get(player) == team
                      for player in article["players"]
                  ):
                      candidates = [
                          pair for pair in game_pairs
                          if team in pair
                      ]

                      if len(candidates) == 1:
                          return candidates[0]

              return None

          groups = defaultdict(list)

          for article in unique:
              pair = find_game_pair(article)

              if pair and article["event"] in [
                  "SPIEL", "VIDEO", "DATEN"
              ]:
                  key = "SPIEL:" + ":".join(pair)

              elif article["players"]:
                  key = (
                      "AUSTRIAN:"
                      + ":".join(article["players"])
                      + ":"
                      + article["event"]
                  )

              elif (
                  article["event"] in NEWS_EVENTS
                  and len(article["teams"]) == 1
              ):
                  key = (
                      article["event"]
                      + ":"
                      + article["teams"][0]
                  )

              else:
                  key = "EINZEL:" + article["id"]

              groups[key].append(article)

          def category(key, items):
              if key.startswith("SPIEL:"):
                  return "SPIELBERICHTE"

              if any(
                  item["players"] for item in items
              ):
                  return "AUSTRIAN WATCH"

              if any(
                  item["event"] in NEWS_EVENTS
                  for item in items
              ):
                  return "TOP STORIES"

              return "WEITERE MELDUNGEN"

          def print_group(key, items):
              print("\n--------------------")
              print("Ereignis:", key)
              print("Artikel:", len(items))

              print(
                  "Quellen:",
                  ", ".join(sorted(set(
                      item["source"] for item in items
                  )))
              )

              players = sorted(set(
                  player
                  for item in items
                  for player in item["players"]
              ))

              if players:
                  print(
                      "Austrian Watch:",
                      ", ".join(players)
                  )

              for item in items[:5]:
                  print(
                      " - [" + item["type"] + "]",
                      item["title"]
                  )

          print("\n===== DUBLETTENKONTROLLE =====")
          print("Rohkandidaten:", len(articles))
          print("Eindeutige Artikel:", len(unique))
          print(
              "Entfernte Schlagzeilen-Dubletten:",
              len(articles) - len(unique)
          )

          for key, extra in list(
              duplicates.items()
          )[:12]:
              original = by_headline[key]
              print(
                  "DUBLETTE:",
                  original["title"]
              )
              print(
                  "Quellen:",
                  ", ".join(
                      [original["source"]]
                      + [item["source"] for item in extra]
                  )
              )

          for section in [
              "AUSTRIAN WATCH",
              "TOP STORIES",
              "SPIELBERICHTE",
              "WEITERE MELDUNGEN"
          ]:
              selected = [
                  (key, items)
                  for key, items in groups.items()
                  if category(key, items) == section
              ]

              selected.sort(
                  key=lambda pair: max(
                      item["date"] for item in pair[1]
                  ),
                  reverse=True
              )

              print(
                  f"\n===== {section}: "
                  f"{len(selected)} THEMEN ====="
              )

              for key, items in selected[:20]:
                  print_group(key, items)

          print("\n===== SICHERHEITSKONTROLLE =====")

          for key, items in groups.items():
              if key.startswith("SPIEL:"):
                  for item in items:
                      if len(item["teams"]) == 1:
                          print(
                              "EIN-TEAM-ZUORDNUNG:",
                              key,
                              "|",
                              item["title"]
                          )

          print(
              "\nRedaktionstest 50I abgeschlossen."
          )
          PY
