name: THE HUDDLE - Erste echte Ausgabe (manuell)
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entwurf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Abhaengigkeiten installieren
        run: python -m pip install requests feedparser trafilatura googlenewsdecoder openai
      - name: Aktuelle NFL-Quellen sammeln
        run: python scripts/collect_sources_10.py
      - name: Aktuelle ESPN-Spielstaende abrufen
        run: python scripts/fetch_scores.py
      - name: Journalistischen Entwurf erstellen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUDDLE_EDITORIAL_MODEL: gpt-5-mini
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY fehlt'; exit 1; }
          python scripts/build_first_issue.py
          test -s drafts/the-huddle-erstausgabe.md
          test -s drafts/the-huddle-erstausgabe-meta.json
      - name: Entwurf und Quellen sichern
        uses: actions/upload-artifact@v4
        with:
          name: the-huddle-erstausgabe
          path: |
            drafts/the-huddle-erstausgabe.md
            drafts/the-huddle-erstausgabe-meta.json
            drafts/quellen-10.json
            drafts/quellenbericht-10.md
            drafts/nfl-spiele-08.md
          if-no-files-found: error
          retention-days: 14
