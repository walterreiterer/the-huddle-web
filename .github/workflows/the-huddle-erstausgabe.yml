name: THE HUDDLE - Erste echte Ausgabe (manuell)
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional: erfolgreicher Run von Schritt 55'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  entwurf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Abhaengigkeiten
      run: python -m pip install requests openai
    - name: Redaktionsentwurf einmalig generieren
      env:
        GITHUB_TOKEN: ${{ github.token }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: "test -n \"$OPENAI_API_KEY\" || (echo \"Fehlendes GitHub Secret OPENAI_API_KEY\" && exit 1)\nmkdir -p drafts\n\
        cat > /tmp/huddle_issue.py <<'PYCODE'\nimport os,io,json,zipfile,requests\nfrom datetime import datetime,timezone\n\
        from openai import OpenAI\nrepo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GITHUB_TOKEN']\nheaders={'Authorization':'Bearer\
        \ '+token,'Accept':'application/vnd.github+json'}\ns=requests.Session()\ndef api(path,params=None):\n r=s.get('https://api.github.com'+path,headers=headers,params=params,timeout=25);r.raise_for_status();return\
        \ r.json()\nrid=os.environ.get('SOURCE_RUN_ID','').strip()\nif not rid:\n runs=api(f'/repos/{repo}/actions/workflows/the-huddle-55.yml/runs',{'status':'success','per_page':25}).get('workflow_runs',[])\n\
        \ if not runs:raise RuntimeError('Schritt 55 nicht gefunden')\n rid=str(runs[0]['id'])\narts=api(f'/repos/{repo}/actions/runs/{rid}/artifacts').get('artifacts',[])\n\
        a=next((x for x in arts if x['name']=='the-huddle-nachrichten-55' and not x['expired']),None)\nif not a:raise RuntimeError('Schritt-55-Artefakt\
        \ fehlt')\nr=s.get(a['archive_download_url'],headers=headers,timeout=40);r.raise_for_status()\nwith zipfile.ZipFile(io.BytesIO(r.content))\
        \ as z:data=json.loads(z.read('the-huddle-55.json'))\n# Only 55 source evidence is passed to the model; no unsupported\
        \ facts.\nstories=data.get('top_stories',[])[:8]\naw=data.get('austrian_watch',[])[:8]\ngames=[g for g in data.get('games',[])\
        \ if g.get('completed')][:16]\nif not stories and not games:raise RuntimeError('Keine ausreichenden Daten aus 55')\n\
        source={'timestamp_utc':datetime.now(timezone.utc).isoformat(),'top_stories':stories,'austrian_watch':aw,'games':games}\n\
        # Cap input and output to keep a single manual API request inexpensive.\nserialized=json.dumps(source,ensure_ascii=False)[:19000]\n\
        instructions=\"\"\"Du bist Redakteur von THE HUDDLE, einem seriösen deutschsprachigen NFL-Morgenjournal für Österreich.\n\
        Schreibe einen vollständigen, gut lesbaren MARKDOWN-ENTWURF, nicht bloß eine Quellensammlung.\nAbschnitte: Titel und\
        \ Datum, NFL in 60 Sekunden (90-130 Wörter), Top Stories (bis zu 4, je 70-110 Wörter), Austrian Watch (2-3 Absätze),\
        \ Game Center (alle gelieferten Final-Ergebnisse kompakt), Quellen- und Redaktionshinweise.\nArbeite ausschließlich\
        \ mit dem beigefügten JSON. Jede berichtete Nachricht braucht einen direkt danebenstehenden Originalquellenlink. Behandle\
        \ RSS-Kurzbeschreibungen als begrenzte Quellen und formuliere keine Details hinzu. Spekulationen und Meinungen nicht\
        \ als bestätigte Fakten darstellen. Doppelte Themen zusammenführen; wenn zu wenige harte Nachrichten vorhanden sind,\
        \ lieber weniger Stories als erfundene Meldungen. Datumsangaben der Quellen beachten, ältere Austrian-Watch-Beiträge\
        \ als Rückblick kennzeichnen. Colts-Entwicklungen können ohne direkte Namensnennung für Bernhard Raimann relevant\
        \ sein, aber keine persönlichen Folgen ohne Beleg behaupten. Valentin Senn nur bei konkretem Beleg. Spielstände nur\
        \ aus abgeschlossenen Spielen übernehmen. Auf Deutsch formulieren; NFL-Eigennamen beibehalten. Keine Werbesprache,\
        \ keine erfundenen Zitate. Am Ende deutlich: ENTWURF – Faktenprüfung und Freigabe ausständig. Keine automatische Publikation.\"\
        \"\"\nclient=OpenAI(api_key=os.environ['OPENAI_API_KEY'],timeout=90,max_retries=0)\nresp=client.responses.create(model='gpt-6.1-terra',instructions=instructions,input=serialized,max_output_tokens=2600,store=False)\n\
        text=(resp.output_text or '').strip()\nif len(text)<700:raise RuntimeError('KI-Ausgabe unvollständig; keine Veröffentlichung.\
        \ Status: '+str(resp.status))\nos.makedirs('drafts',exist_ok=True)\nwith open('drafts/the-huddle-erstausgabe.md','w',encoding='utf-8')\
        \ as f:f.write(text+'\\n')\nusage=resp.usage\nwith open('drafts/the-huddle-erstausgabe-meta.json','w',encoding='utf-8')\
        \ as f:\n json.dump({'source_55_run':rid,'model':'gpt-6.1-terra','response_status':resp.status,\n 'input_tokens':getattr(usage,'input_tokens',None),'output_tokens':getattr(usage,'output_tokens',None),\n\
        \ 'approved':False,'published':False,'api_calls':1},f,ensure_ascii=False,indent=2)\nprint('Redaktionsentwurf erzeugt.\
        \ Tokenverbrauch:',getattr(usage,'input_tokens',None),getattr(usage,'output_tokens',None))\nPYCODE'\npython /tmp/huddle_issue.py"
    - name: Entwurf sichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: the-huddle-erstausgabe
        path: drafts/the-huddle-erstausgabe*
        if-no-files-found: warn
        retention-days: 7
