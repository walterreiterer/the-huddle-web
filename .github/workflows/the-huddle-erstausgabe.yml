name: THE HUDDLE - Erste echte Ausgabe (manuell)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional: erfolgreicher Run von Schritt 55'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  entwurf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Abhaengigkeiten
        run: python -m pip install requests openai
      - name: Redaktionsentwurf einmalig generieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'Fehlendes GitHub Secret OPENAI_API_KEY'; exit 1; }
          python scripts/build_first_issue.py
          test -s drafts/the-huddle-erstausgabe.md
          test -s drafts/the-huddle-erstausgabe-meta.json
      - name: Entwurf sichern
        uses: actions/upload-artifact@v4
        with:
          name: the-huddle-erstausgabe
          path: |
            drafts/the-huddle-erstausgabe.md
            drafts/the-huddle-erstausgabe-meta.json
          if-no-files-found: error
          retention-days: 7
