name: THE HUDDLE – Themenvergleich 1.9.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nachrichtenquellen sammeln
        run: |
          pip install requests feedparser trafilatura googlenewsdecoder
          python scripts/collect_sources_10.py
      - name: Themenauswahl 1.9.2 testen
        run: python scripts/compare_topics_192.py
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huddle-themenvergleich-192
          path: |
            drafts/themenvergleich-192.md
            drafts/quellen-10.json
          if-no-files-found: warn
          retention-days: 7
