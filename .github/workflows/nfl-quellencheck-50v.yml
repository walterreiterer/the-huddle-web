name: THE HUDDLE - Quellencheck 50V (manuell)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional: Run-ID des 50U-Laufs (leer = neuestes gueltiges 50U-Artifact)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  quellencheck-50v:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhaengigkeiten installieren
        run: python -m pip install requests beautifulsoup4 trafilatura
      - name: Sechs ESPN-Quellen aus 50U technisch pruefen
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import io, json, os, re, zipfile
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup
          import trafilatura
          
          OUT=Path('drafts'); OUT.mkdir(exist_ok=True)
          API='https://api.github.com'; REPO=os.environ['GITHUB_REPOSITORY']
          TOKEN=os.environ['GITHUB_TOKEN']; RUN_ID=os.environ.get('SOURCE_RUN_ID','').strip()
          S=requests.Session(); S.headers.update({'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'TheHuddle-50V-manual-source-audit'})
          
          def github_get(path):
           r=S.get(API+path,timeout=30); r.raise_for_status(); return r.json()
          
          artifacts=github_get('/repos/'+REPO+'/actions/artifacts?name=the-huddle-probe-50u&per_page=100').get('artifacts',[])
          artifacts=[a for a in artifacts if a.get('name')=='the-huddle-probe-50u' and not a.get('expired') and (not RUN_ID or str(a.get('workflow_run',{}).get('id'))==RUN_ID)]
          if not artifacts:
           raise SystemExit('Kein gueltiges 50U-Artifact gefunden. Bitte 50U erneut starten oder source_run_id angeben.')
          art=max(artifacts,key=lambda a:a.get('created_at',''))
          print('50U Artifact:',art['id'],'Run:',art.get('workflow_run',{}).get('id'))
          r=S.get(art['archive_download_url'],timeout=45); r.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
           paths=[n for n in z.namelist() if n.endswith('research-50u.json')]
           if not paths: raise SystemExit('Artifact enthaelt keine research-50u.json')
           data=json.loads(z.read(paths[0]))
          items=data.get('top_stories',[])
          if not items: raise SystemExit('50U hat keine Top Stories')
          print('Top Stories fuer Quellencheck:',len(items))
          
          WEB=requests.Session(); WEB.headers.update({'User-Agent':'Mozilla/5.0 (compatible; TheHuddleEditorialResearch/50V; manual test)','Accept-Language':'en-US,en;q=0.8'})
          STOP={'the','a','an','of','to','for','in','on','with','and','at','by','from','is','as','after','per','vs','nfl','says','said'}
          def words(s): return set(w for w in re.findall(r'[a-z0-9]+',str(s).lower()) if len(w)>2 and w not in STOP)
          def similarity(a,b):
           x,y=words(a),words(b)
           return round(len(x&y)/max(1,len(x)),2)
          def find_meta(soup,attrs):
           for kw in attrs:
            tag=soup.find('meta',attrs=kw)
            if tag and tag.get('content'): return tag['content'].strip()
           return ''
          def check(item):
           url=item.get('url',''); title=item.get('title','')
           result={'title':title,'source_url':url,'published_from_50u':item.get('published_utc'),'status':'NOT_TESTED','http_status':None,'final_url':None,'page_title':None,'title_overlap':None,'published_on_page':None,'extracted_words':0,'paywall_or_block_hint':False,'notes':[],'fact_checked':False}
           p=urlparse(url)
           if p.scheme!='https' or p.hostname not in ('espn.com','www.espn.com'):
            result['status']='INVALID_URL'; return result
           try:
            response=WEB.get(url,timeout=18,allow_redirects=True)
            result['http_status']=response.status_code; result['final_url']=response.url
            final=urlparse(response.url)
            if final.hostname not in ('espn.com','www.espn.com'):
             result['status']='REDIRECT_OFF_DOMAIN';return result
            if response.status_code!=200:
             result['status']='HTTP_ERROR';return result
            html=response.text[:2000000]
            soup=BeautifulSoup(html,'html.parser')
            page_title=find_meta(soup,[{'property':'og:title'},{'name':'twitter:title'}]) or (soup.title.get_text(' ',strip=True) if soup.title else '')
            result['page_title']=page_title[:220]
            result['title_overlap']=similarity(title,page_title) if page_title else 0
            result['published_on_page']=find_meta(soup,[{'property':'article:published_time'},{'name':'date'},{'itemprop':'datePublished'}]) or None
            text=trafilatura.extract(html,include_comments=False,include_tables=False,output_format='txt') or ''
            result['extracted_words']=len(text.split())
            result['paywall_or_block_hint']=bool(re.search(r'subscribe to read|sign in to continue|access denied|captcha|enable javascript|premium content',html,re.I))
            if result['extracted_words']<100:
             result['status']='NO_USABLE_TEXT';result['notes'].append('Kein ausreichender Artikeltext extrahierbar')
            elif result['title_overlap']<0.35:
             result['status']='TITLE_MISMATCH';result['notes'].append('Seitentitel stimmt nicht ausreichend mit ESPN-API-Titel ueberein')
            else:
             result['status']='TEXT_EXTRACTED';result['notes'].append('Technische Extraktion erfolgreich, keine Faktenfreigabe')
            if not result['published_on_page']: result['notes'].append('Publikationsdatum auf HTML-Seite nicht nachgewiesen')
           except requests.RequestException as e:
            result['status']='NETWORK_ERROR';result['notes'].append(type(e).__name__+': '+str(e)[:150])
           except Exception as e:
            result['status']='PARSER_ERROR';result['notes'].append(type(e).__name__+': '+str(e)[:150])
           return result
          
          results=[]
          for idx,item in enumerate(items,1):
           res=check(item);results.append(res)
           print(f"{idx}/{len(items)} {res['status']} HTTP={res['http_status']} words={res['extracted_words']} overlap={res['title_overlap']} {res['title'][:75]}")
          counts=dict(Counter(x['status'] for x in results))
          report={'version':'50V','generated_utc':datetime.now(timezone.utc).isoformat(),'source_artifact_id':art['id'],'source_run_id':art.get('workflow_run',{}).get('id'),'source_50u_generated_utc':data.get('generated_utc'),'counts':counts,'articles':results,'publication_approved':False,'fact_checked':False,'full_article_text_saved':False}
          (OUT/'quellencheck-50v.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# THE HUDDLE – Quellencheck 50V','',f"Quelle: 50U-Artifact {art['id']} · 50U-Datenstand: {data.get('generated_utc','unbekannt')}",'',f"Testzeitpunkt: {report['generated_utc']}",'', '**Dies ist eine technische Quellenpruefung, keine journalistische Faktenfreigabe.**','', '## Statusverteilung','']
          for k,v in sorted(counts.items()):lines.append(f'- {k}: {v}')
          lines+=['','## Sechs Top-Story-Quellen','']
          for i,x in enumerate(results,1):
           lines += [f"### {i}. {x['title']}",f"- URL: {x['source_url']}",f"- Status: **{x['status']}**; HTTP: {x['http_status']}; extrahierte Woerter: {x['extracted_words']}; Titel-Uebereinstimmung: {x['title_overlap']}",f"- Datum in 50U: {x['published_from_50u']}; Datum auf Seite: {x['published_on_page'] or 'nicht gefunden'}",f"- Hinweis: {'; '.join(x['notes']) or 'Kein Zusatzhinweis'}",'- Redaktionell geprueft: **NEIN**','']
          lines+=['## Naechste redaktionelle Pruefung','', '1. Volltext bei ESPN im Browser lesen; technische Extraktion ist kein Beweis fuer Richtigkeit.','2. Aussagen, Namen, Zeitpunkte und Zitate anhand des Originals pruefen.','3. Sensible Behauptungen und unsichere Meldungen zusaetzlich gegenpruefen.','4. Erst danach deutsche Texte verfassen und persoenlich freigeben.','', 'Keine automatische Publikation. Keine OpenAI-API-Nutzung.']
          (OUT/'quellencheck-50v.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('FERTIG:',counts)
          PY
      - name: Quellencheck als Artifact speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-huddle-quellencheck-50v
          path: drafts/quellencheck-50v.*
          if-no-files-found: warn
          retention-days: 7
