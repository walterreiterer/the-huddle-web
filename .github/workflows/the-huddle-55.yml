name: THE HUDDLE - Nachrichteninhalte 55 (manuell)
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional: Run-ID von Schritt 54; leer = letzter erfolgreicher Lauf'
        required: false
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Abhaengigkeiten installieren
      run: python -m pip install requests feedparser
    - name: RSS-Nachrichten recherchieren und Entwurf erstellen
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: "mkdir -p drafts\ncat > /tmp/the_huddle_55.py <<'PY'\nimport os,io,json,zipfile,re,html,requests,feedparser\nfrom\
        \ datetime import datetime,timezone,timedelta\nfrom email.utils import parsedate_to_datetime\nfrom urllib.parse import\
        \ urlparse\nNOW=datetime.now(timezone.utc)\nS=requests.Session();S.headers.update({'User-Agent':'TheHuddle/55 RSS\
        \ research (editorial draft)'})\nREPO=os.environ['GITHUB_REPOSITORY']; HEAD={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}\n\
        def api(path,params=None):\n r=S.get('https://api.github.com'+path,headers=HEAD,params=params,timeout=25);r.raise_for_status();return\
        \ r.json()\ndef load54():\n rid=os.getenv('SOURCE_RUN_ID','').strip()\n if not rid:\n  runs=api('/repos/'+REPO+'/actions/workflows/the-huddle-54.yml/runs',{'status':'success','per_page':20}).get('workflow_runs',[])\n\
        \  if not runs:raise RuntimeError('Kein erfolgreicher Schritt-54-Lauf vorhanden')\n  rid=str(runs[0]['id'])\n arts=api('/repos/'+REPO+'/actions/runs/'+rid+'/artifacts').get('artifacts',[])\n\
        \ a=next((a for a in arts if a['name']=='the-huddle-redaktionstest-54' and not a['expired']),None)\n if not a:raise\
        \ RuntimeError('54-Artefakt nicht vorhanden oder abgelaufen')\n r=S.get(a['archive_download_url'],headers=HEAD,timeout=40);r.raise_for_status()\n\
        \ with zipfile.ZipFile(io.BytesIO(r.content)) as z:return json.loads(z.read('the-huddle-54.json')),rid\nold,run54=load54()\n\
        def clean(s):return re.sub(r'\\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s or ''))).strip()\ndef published(entry):\n\
        \ if entry.get('published_parsed'):\n  import calendar\n  return datetime.fromtimestamp(calendar.timegm(entry.published_parsed),timezone.utc)\n\
        \ try:return parsedate_to_datetime(entry.get('published','')).astimezone(timezone.utc)\n except:return None\nfeeds={'ESPN':'https://www.espn.com/espn/rss/nfl/news',\n\
        \       'CBS Sports':'https://www.cbssports.com/rss/headlines/nfl/',\n       'The Guardian':'https://www.theguardian.com/sport/nfl/rss'}\n\
        exclude=('fantasy','betting','odds','sportsbook','wager','parlay','prop bet','how to watch',\n         'power rankings','mock\
        \ draft','predictions','picks against','watch live',\n         'uniforms','shoes','sneakers','podcast','hot takes','start\
        \ em','sit em')\n# Only describe what RSS actually says. No automated English->German invented paraphrases.\nitems=[];diagnostics=[];seen=set()\n\
        for source,url in feeds.items():\n try:\n  r=S.get(url,timeout=25);r.raise_for_status()\n  feed=feedparser.parse(r.content)\n\
        \  if not feed.entries:diagnostics.append(source+': keine Feed-Eintraege (HTTP '+str(r.status_code)+')')\n  count=0\n\
        \  for e in feed.entries:\n   title=clean(e.get('title',''));link=e.get('link','');desc=clean(e.get('summary','')\
        \ or e.get('description',''))\n   dt=published(e)\n   if not dt or not NOW-timedelta(hours=72)<=dt<=NOW+timedelta(hours=2):continue\n\
        \   if not link.startswith('https://') or not title:continue\n   if any(x in (title+' '+link).lower() for x in exclude):continue\n\
        \   if len(desc)<65:continue\n   key=re.sub(r'[^a-z0-9]+','',title.lower())[:85]\n   if key in seen:continue\n   seen.add(key)\n\
        \   score=0\n   t=title.lower()\n   for word,points in [('trade',5),('traded',5),('fired',5),('injur',4),('suspend',4),\n\
        \                       ('sign',3),('deal',3),('win',3),('beat',3),('record',3),\n                       ('coach',2),('quarterback',2),('colts',2),('seahawks',1)]:\n\
        \    if word in t:score+=points\n   items.append({'source':source,'title':title,'url':link,'published_utc':dt.isoformat(),\n\
        \                 'rss_description':desc[:650],'description_available':True,\n                 'score':score,'fact_checked':False})\n\
        \   count+=1\n  diagnostics.append(source+': '+str(count)+' aktuelle qualifizierte RSS-Treffer')\n except Exception\
        \ as ex:diagnostics.append(source+': Abruf fehlgeschlagen: '+str(ex)[:130])\nitems.sort(key=lambda x:(x['score'],x['published_utc']),reverse=True)\n\
        selected=items[:5]\naw=old.get('austrian_watch',[]);games=old.get('games',[])\ndef link(label,url):return '['+label.replace('[','(').replace(']',')')+']('+url+')'\n\
        lines=['# THE HUDDLE – Redaktionstest 55','',\n       '**RECHERCHEENTWURF – NICHT VERÖFFENTLICHEN**','',\n       'Stand:\
        \ '+NOW.strftime('%d.%m.%Y %H:%M UTC')+' | Vorlauf: 54-Run '+run54,'',\n       '## Die NFL in 60 Sekunden','',\n \
        \      '**Redaktioneller Arbeitsstand:** Die wichtigsten aktuellen Meldungen liegen jetzt mit RSS-Kurzbeschreibungen\
        \ und Originalquellen vor. '\n       'Eine deutsche, faktisch überprüfte Nachrichtenfassung ist erst nach redaktioneller\
        \ Sichtung möglich.','']\nif selected:\n lines.append('Im Fokus der Recherche stehen '+str(len(selected))+' Meldungen\
        \ aus '+', '.join(sorted(set(x['source'] for x in selected)))+'.')\n lines.append('Die führenden Themen: '+ ' / '.join(x['title']\
        \ for x in selected[:3])+'.')\nif games:lines.append('Game Center: '+str(len(games))+' aus dem vorherigen Test übernommene\
        \ Endergebnisse.')\nif aw:lines.append('Austrian Watch: '+str(len(aw))+' Originalquellen aus Schritt 54 zur weiteren\
        \ Prüfung.')\nlines+=['','## Top Stories – mit RSS-Beschreibungen','']\nfor i,x in enumerate(selected,1):\n lines+=['###\
        \ '+str(i)+'. '+x['title'],\n         '**Quelle:** '+link(x['source'],x['url'])+' | '+x['published_utc'][:16]+' UTC',\n\
        \         '**RSS-Beschreibung (Originalsprache; Recherchematerial, kein Abdrucktext):** '+x['rss_description'],\n\
        \         '**Redaktion:** Meldung anhand des verlinkten Originals prüfen, dann eigenständig auf Deutsch formulieren.','']\n\
        if not selected:lines+=['Keine aktuellen Meldungen mit hinreichender RSS-Beschreibung gefunden.','']\nlines+=['##\
        \ Austrian Watch','']\nfor x in aw:\n lines.append('- '+link(x.get('title','Quelle'),x.get('url',''))+' – '+x.get('reason','Quellenprüfung\
        \ offen'))\nif not aw:lines.append('Keine Austrian-Watch-Daten aus Schritt 54.')\nlines+=['','## Game Center','']\n\
        for g in games:\n a=g.get('away',{});h=g.get('home',{})\n lines.append('- '+a.get('team','?')+' '+str(a.get('score','?'))+'\
        \ : '+str(h.get('score','?'))+' '+h.get('team','?')+' (Final)')\nif not games:lines.append('Keine übernommenen Endergebnisse.')\n\
        lines+=['','## Feed-Diagnose','']+['- '+d for d in diagnostics]\nlines+=['','## Redaktionelle Freigabe','',\n    \
        \    '- [ ] RSS-Beschreibungen mit Originalartikeln abgleichen',\n        '- [ ] Deutsche Kurztexte und 60-Sekunden-Brief\
        \ selbständig formulieren',\n        '- [ ] Aktualität, Dubletten und Nachrichtenwert prüfen',\n        '- [ ] Austrian\
        \ Watch verdichten und Game Center kontrollieren',\n        '- [ ] Erst nach ausdrücklicher Freigabe veröffentlichen','',\n\
        \        '**Keine KI-API verwendet. Keine automatische Veröffentlichung.**']\nos.makedirs('drafts',exist_ok=True)\n\
        open('drafts/the-huddle-55.md','w',encoding='utf-8').write('\\n'.join(lines)+'\\n')\nwith open('drafts/the-huddle-55.json','w',encoding='utf-8')\
        \ as f:\n json.dump({'version':'55','generated_utc':NOW.isoformat(),'source_54_run':run54,\n            'rss_candidates':len(items),'top_stories':selected,'austrian_watch':aw,\n\
        \            'games':games,'diagnostics':diagnostics,'approved':False,'fact_checked':False,\n            'published':False,'api_cost_usd':0},f,ensure_ascii=False,indent=2)\n\
        print('55:',len(items),'RSS-Kandidaten,',len(selected),'Top Stories,',len(aw),'AW-Quellen,',len(games),'Spiele')\n\
        PY\npython /tmp/the_huddle_55.py"
    - name: Entwurf als Artefakt sichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: the-huddle-nachrichten-55
        path: drafts/the-huddle-55.*
        if-no-files-found: warn
        retention-days: 7
