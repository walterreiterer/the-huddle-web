name: THE HUDDLE – automatische Testvorschau
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
permissions:
  contents: write
concurrency:
  group: huddle-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wien 07 Uhr prüfen
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Vienna'))
          run=os.environ['EVENT_NAME']=='workflow_dispatch' or now.hour==7
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(run).lower()+'\n')
          print('Wien:',now,'Run:',run)
          PYCODE
      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.time.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Pakete installieren
        if: steps.time.outputs.run == 'true'
        run: pip install requests feedparser trafilatura googlenewsdecoder
      - name: Scores abrufen
        if: steps.time.outputs.run == 'true'
        run: python scripts/fetch_scores.py
      - name: Quellen sammeln
        if: steps.time.outputs.run == 'true'
        run: python scripts/collect_sources_10.py
      - name: Sky-Zugriff diagnostizieren (nur Test)
        if: steps.time.outputs.run == 'true'
        continue-on-error: true
        run: |
          python scripts/sky_diagnose.py
          echo 'Direkter Sky-Artikeltest (HTTP-Status):'
          curl --location --silent --show-error --max-time 20 --output /dev/null \
            --write-out 'Sky-Raimann-Artikel: HTTP %{http_code}\n' \
            'https://www.skysportaustria.at/niederlage-gegen-cowboys-playoffs-fuer-colts-und-raimann-in-weiter-ferne/'
      - name: Ausgabe erstellen
        if: steps.time.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/build_morning_13.py

      - name: Test-JSON erzeugen
        if: steps.time.outputs.run == 'true'
        run: python scripts/convert_morning_14.py

      - name: Gamebooks aus Archiv ergänzen
        if: steps.time.outputs.run == 'true'
        run: python scripts/add_gamebooks_preview.py

      - name: Test-JSON prüfen
        if: steps.time.outputs.run == 'true'
        run: python scripts/check_preview.py

      - name: Redaktionelle Dopplungen kontrollieren (0.9)
        if: steps.time.outputs.run == 'true'
        run: python scripts/editorial_gate_09.py

      - name: Quellen-Audit erstellen (0.9.3 – keine Freigabe)
        if: steps.time.outputs.run == 'true'
        run: python scripts/source_audit_093.py

      - name: Redaktionelle Sicherheitsschranke (0.9.4)
        if: steps.time.outputs.run == 'true'
        run: python scripts/editorial_safety_094.py
        
      - name: Unabhängige Gegenprüfung 1.9.5
        if: steps.time.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/review_independent_195.py

      - name: Automatische Schlussredaktion 2.0
        if: steps.time.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/huddle_schlussredaktion_20.py

      - name: Teamnamen, Zeitbezug und Quellen prüfen (2.1)
        if: steps.time.outputs.run == 'true'
        run: python scripts/quality_gate_21.py

      - name: Redaktionsstatus verbindlich prüfen (nur Test, keine Freigabe)
        if: steps.time.outputs.run == 'true'
        run: python scripts/check_editorial_status.py

      - name: Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huddle-preview-diagnose
          path: |
            drafts/
            sky-diagnose.json
          if-no-files-found: ignore
          retention-days: 7
