
name: THE HUDDLE – Game Book Archiv

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "NFL-Spieltag (YYYYMMDD)"
        required: true
        default: "20261101"

permissions:
  contents: write

concurrency:
  group: huddle-gamebook-archive
  cancel-in-progress: false

jobs:
  archive-gamebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests pypdf

      - name: Offizielle Game Books recherchieren
        env:
          GAMEBOOK_DATE: ${{ inputs.game_date }}
        run: python scripts/test_gamebooks.py

      - name: Archivdatei überprüfen
        id: check
        env:
          GAMEBOOK_DATE: ${{ inputs.game_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          date = os.environ["GAMEBOOK_DATE"]
          path = Path("data/gamebooks") / f"{date}.json"

          if not path.exists():
              print("Kein Archiv erzeugt. Keine Veröffentlichung.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("publish=false\n")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          links = data.get("gamebooks", {})

          if data.get("date") != date or not isinstance(links, dict) or not links:
              raise SystemExit("Archivprüfung fehlgeschlagen.")

          print(f"Archiv geprüft: {date}, {len(links)} Game Books")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("publish=true\n")
          PY

      - name: Bestehende Archivdaten schützen
        if: steps.check.outputs.publish == 'true'
        env:
          GAMEBOOK_DATE: ${{ inputs.game_date }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          date = os.environ["GAMEBOOK_DATE"]
          path = Path("data/gamebooks") / f"{date}.json"
          new_data = json.loads(path.read_text(encoding="utf-8"))
          new_links = new_data["gamebooks"]

          old = subprocess.run(
              ["git", "show", f"HEAD:{path.as_posix()}"],
              capture_output=True,
              text=True
          )

          if old.returncode == 0:
              old_data = json.loads(old.stdout)
              if old_data.get("date") != date:
                  raise SystemExit("Bestehendes Archiv hat falsches Datum.")

              old_links = old_data.get("gamebooks", {})
              if not isinstance(old_links, dict):
                  raise SystemExit("Bestehendes Archiv ist ungültig.")

              # Bereits bestätigte Links nicht verlieren.
              merged = dict(old_links)
              for event_id, url in new_links.items():
                  if event_id not in merged:
                      merged[event_id] = url

              new_data["gamebooks"] = merged
              path.write_text(
                  json.dumps(new_data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print(f"Archiv zusammengeführt: {len(merged)} Einträge")
          PY

      - name: Spieltagsarchiv committen
        if: steps.check.outputs.publish == 'true'
        env:
          GAMEBOOK_DATE: ${{ inputs.game_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/gamebooks/${GAMEBOOK_DATE}.json"

          if git diff --cached --quiet; then
            echo "Keine neuen Archivdaten. Kein Commit erforderlich."
          else
            git commit -m "Game Books archivieren: ${GAMEBOOK_DATE}"
            git push
          fi
