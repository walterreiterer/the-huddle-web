
name: THE HUDDLE – Game Book Archiv

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "NFL-Spieltag (YYYYMMDD) – leer = letzte 3 Tage"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: huddle-gamebook-archive
  cancel-in-progress: false

jobs:
  archive-gamebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests pypdf

      - name: NFL-Spieltage bestimmen
        id: dates
        env:
          REQUESTED_DATE: ${{ inputs.game_date }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          requested = os.environ.get("REQUESTED_DATE", "").strip()

          if requested:
              if not re.fullmatch(r"\d{8}", requested):
                  raise SystemExit("Ungültiges Datum: YYYYMMDD erforderlich.")
              try:
                  datetime.strptime(requested, "%Y%m%d")
              except ValueError:
                  raise SystemExit("Ungültiges Kalenderdatum.")
              dates = [requested]
          else:
              today = datetime.now(ZoneInfo("America/New_York")).date()
              dates = [
                  (today - timedelta(days=days)).strftime("%Y%m%d")
                  for days in (1, 2, 3)
              ]

          print("Zu prüfende NFL-Spieltage:", ", ".join(dates))

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"game_dates={' '.join(dates)}\n")
          PY

      - name: Game Books recherchieren und sicher archivieren
        env:
          GAME_DATES: ${{ steps.dates.outputs.game_dates }}
        shell: bash
        run: |
          set -euo pipefail

          for GAME_DATE in $GAME_DATES; do
            echo "====================================="
            echo "NFL-Spieltag: ${GAME_DATE}"
            echo "====================================="

            export GAMEBOOK_DATE="${GAME_DATE}"

            # Recherche und PDF-Prüfung.
            python scripts/test_gamebooks.py

            # Nur die Archivdatei dieses Spieltags prüfen.
            python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          date = os.environ["GAMEBOOK_DATE"]
          path = Path("data/gamebooks") / f"{date}.json"

          # Ist die Datei unverändert, gibt es nichts zu committen.
          status = subprocess.run(
              ["git", "status", "--porcelain", "--", str(path)],
              capture_output=True,
              text=True,
              check=True
          ).stdout.strip()

          if not status:
              print(f"{date}: Keine neuen Archivdaten.")
              raise SystemExit(0)

          if not path.exists():
              raise SystemExit(f"{date}: Archivdatei fehlt.")

          data = json.loads(path.read_text(encoding="utf-8"))
          links = data.get("gamebooks", {})

          if (
              data.get("date") != date
              or not isinstance(links, dict)
              or not links
          ):
              raise SystemExit(f"{date}: Archivprüfung fehlgeschlagen.")

          old = subprocess.run(
              ["git", "show", f"HEAD:{path.as_posix()}"],
              capture_output=True,
              text=True
          )

          if old.returncode == 0:
              old_data = json.loads(old.stdout)

              if old_data.get("date") != date:
                  raise SystemExit(
                      f"{date}: Bestehendes Archiv hat falsches Datum."
                  )

              old_links = old_data.get("gamebooks", {})

              if not isinstance(old_links, dict):
                  raise SystemExit(
                      f"{date}: Bestehendes Archiv ist ungültig."
                  )

              # Bereits bestätigte Links behalten.
              merged = dict(old_links)

              for event_id, url in links.items():
                  if event_id not in merged:
                      merged[event_id] = url

              data["gamebooks"] = merged

              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

              print(
                  f"{date}: Archiv zusammengeführt, "
                  f"{len(merged)} bestätigte Game Books."
              )
          else:
              print(
                  f"{date}: Neues Archiv mit "
                  f"{len(links)} bestätigten Game Books."
              )
          PY

            # Nur bestätigte Änderungen committen.
                        if [ ! -f "data/gamebooks/${GAME_DATE}.json" ]; then
              echo "${GAME_DATE}: Spielfreier Tag – kein Archiv vorhanden."
              continue
            fi

            git add "data/gamebooks/${GAME_DATE}.json"

            if git diff --cached --quiet; then
              echo "${GAME_DATE}: Kein Commit erforderlich."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "Game Books archivieren: ${GAME_DATE}"
              git push

              echo "${GAME_DATE}: Archiv erfolgreich aktualisiert."
            fi
          done

          echo "====================================="
          echo "Drei-Tage-Archivprüfung abgeschlossen."
