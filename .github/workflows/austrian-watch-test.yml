
name: THE HUDDLE – Austrian Watch Quellencheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: Österreichische NFL-Quellen prüfen
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import feedparser
          from html import unescape
          import re

          sources = {
              "Football-Austria": [
                  "https://football-austria.com/feed/"
              ],
              "ORF Sport": [
                  "https://rss.orf.at/sport.xml"
              ],
              "LAOLA1": [
                  "https://www.laola1.at/feed/",
                  "https://www.laola1.at/rss/"
              ],
              "Kronen Zeitung": [
                  "https://www.krone.at/sport/rss",
                  "https://www.krone.at/rss"
              ],
              "DER STANDARD": [
                  "https://www.derstandard.at/rss/sport",
                  "https://derstandard.at/rss/sport"
              ],
              "kicker.at": [
                  "https://www.kicker.at/rss/news"
              ],
              "kicker.de": [
                  "https://www.kicker.de/rss/news"
              ],
              "football-world.news": [
                  "https://www.football-world.news/feed/"
              ],
              "Sky Sport Austria": [
                  "https://www.skysportaustria.at/feed/"
              ],
              "KURIER": [
                  "https://kurier.at/rss/sport",
                  "https://kurier.at/rss"
              ]
          }

          terms = (
              "nfl", "american football", "raimann",
              "reimann", "valentin senn",
              "indianapolis colts", "arizona cardinals",
              "super bowl", "mahomes", "chiefs",
              "seahawks", "touchdown", "quarterback"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; TheHuddleSourceCheck/1.0)",
              "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*"
          })

          for name, urls in sources.items():
              print(f"\n===== {name} =====", flush=True)

              for url in urls:
                  print(f"Prüfe: {url}", flush=True)

                  try:
                      response = session.get(
                          url, timeout=20
                      )
                      print(
                          f"HTTP: {response.status_code}",
                          flush=True
                      )

                      response.raise_for_status()

                      feed = feedparser.parse(response.content)
                      print(
                          f"Feed-Einträge: {len(feed.entries)}",
                          flush=True
                      )

                      if not feed.entries:
                          print("Kein auswertbarer RSS-/Atom-Feed.")
                          continue

                      matches = []

                      for entry in feed.entries:
                          title = entry.get("title", "")
                          summary = entry.get("summary", "")
                          content = unescape(
                              re.sub(
                                  r"<[^>]+>", " ",
                                  title + " " + summary
                              )
                          ).lower()

                          if any(term in content for term in terms):
                              matches.append(entry)

                      print(f"NFL-Treffer: {len(matches)}")

                      for entry in matches[:8]:
                          print("--------------------")
                          print("Titel:", entry.get("title", ""))
                          print(
                              "Datum:",
                              entry.get(
                                  "published",
                                  entry.get("updated", "Unbekannt")
                              )
                          )
                          print("Link:", entry.get("link", ""))

                  except requests.RequestException as exc:
                      print("Abruffehler:", str(exc))

          print("\nErweiterter Quellencheck abgeschlossen.")
          PY
