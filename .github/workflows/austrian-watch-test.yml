
name: THE HUDDLE – Austrian Watch Quellencheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests feedparser

      - name: Austrian Watch und NFL filtern
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import feedparser
          import re
          import calendar

          from html import unescape
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlsplit, urlunsplit

          SOURCES = {
              "Football-Austria":
                  "https://football-austria.com/feed/",
              "ORF Sport":
                  "https://rss.orf.at/sport.xml",
              "DER STANDARD":
                  "https://www.derstandard.at/rss/sport"
          }

          AUSTRIAN_PLAYERS = {
              "Bernhard Raimann": [
                  r"\braimann\b",
                  r"\bbernhard\s+raimann\b"
              ],
              "Valentin Senn": [
                  r"\bvalentin\s+senn\b"
              ]
          }

          NFL_TERMS = [
              r"\bnfl\b",
              r"\bsuper\s*bowl\b",
              r"\bamerican\s+football\b",
              r"\bquarterback\b",
              r"\btouchdown\b",
              r"\bindianapolis\s+colts\b",
              r"\barizona\s+cardinals\b",
              r"\bkansas\s+city\s+chiefs\b",
              r"\bseattle\s+seahawks\b"
          ]

          MAX_AGE = timedelta(hours=72)
          NOW = datetime.now(timezone.utc)

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "TheHuddleSourceCheck/1.1",
              "Accept":
                  "application/rss+xml, application/atom+xml, application/xml, text/xml, */*"
          })

          austrian_watch = []
          nfl_news = []
          seen_urls = set()

          def clean_text(value):
              value = re.sub(r"<[^>]*>", " ", value or "")
              value = unescape(value)
              return re.sub(r"\s+", " ", value).strip()

          def normalize_url(url):
              parts = urlsplit(url.strip())
              return urlunsplit((
                  parts.scheme.lower(),
                  parts.netloc.lower(),
                  parts.path.rstrip("/") or "/",
                  "",
                  ""
              ))

          def entry_date(entry):
              parsed = (
                  entry.get("published_parsed")
                  or entry.get("updated_parsed")
              )

              if not parsed:
                  return None

              return datetime.fromtimestamp(
                  calendar.timegm(parsed),
                  timezone.utc
              )

          for source, url in SOURCES.items():
              print(f"\n===== {source} =====", flush=True)

              try:
                  response = session.get(url, timeout=20)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()
                  feed = feedparser.parse(response.content)
              except requests.RequestException as exc:
                  print("Abruffehler:", exc)
                  continue

              print("Feed-Einträge:", len(feed.entries))

              recent = 0
              matches = 0

              for entry in feed.entries:
                  published = entry_date(entry)

                  if published is None:
                      continue

                  age = NOW - published

                  if age < timedelta(0) or age > MAX_AGE:
                      continue

                  recent += 1

                  title = clean_text(entry.get("title", ""))
                  summary = clean_text(entry.get("summary", ""))
                  content = (title + " " + summary).lower()
                  url = entry.get("link", "").strip()

                  if not title or not url:
                      continue

                  canonical = normalize_url(url)

                  if canonical in seen_urls:
                      continue

                  players = [
                      name
                      for name, patterns in AUSTRIAN_PLAYERS.items()
                      if any(
                          re.search(pattern, content)
                          for pattern in patterns
                      )
                  ]

                  is_nfl = any(
                      re.search(pattern, content)
                      for pattern in NFL_TERMS
                  )

                  item = {
                      "source": source,
                      "title": title,
                      "date": published,
                      "url": canonical,
                      "players": players
                  }

                  if players:
                      austrian_watch.append(item)
                  elif is_nfl:
                      nfl_news.append(item)
                  else:
                      continue

                  seen_urls.add(canonical)
                  matches += 1

              print("Aktuelle Artikel:", recent)
              print("Relevante Treffer:", matches)

          austrian_watch.sort(
              key=lambda item: item["date"],
              reverse=True
          )

          nfl_news.sort(
              key=lambda item: item["date"],
              reverse=True
          )

          def print_results(title, items):
              print(f"\n===== {title}: {len(items)} =====")

              for item in items:
                  print("--------------------")
                  print("Quelle:", item["source"])
                  print("Titel:", item["title"])
                  print(
                      "Datum:",
                      item["date"].strftime(
                          "%d.%m.%Y %H:%M UTC"
                      )
                  )
                  if item["players"]:
                      print(
                          "Österreich-Bezug:",
                          ", ".join(item["players"])
                      )
                  print("Link:", item["url"])

          print_results(
              "AUSTRIAN WATCH",
              austrian_watch
          )

          print_results(
              "ALLGEMEINE NFL-NEWS",
              nfl_news
          )

          print("\nFiltertest abgeschlossen.")
          PY
