name: THE HUDDLE – NFL Game Book Recherchetest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gamebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test-Abhängigkeiten installieren
        run: python -m pip install requests pypdf
      - name: NFL Game Books mehrerer Spiele prüfen
        run: python scripts/test_gamebooks.py
