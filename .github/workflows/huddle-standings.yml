name: THE HUDDLE - NFL Tabellen aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: write
concurrency:
  group: huddle-standings-update
  cancel-in-progress: false
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aktuelle NFL Tabellen laden und prüfen
        run: python scripts/update_standings.py
      - name: Nur gültige Tabellenstände veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/standings.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL division standings'
            git push
          fi
