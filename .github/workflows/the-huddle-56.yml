name: THE HUDDLE - Abschlusstest 56 (manuell)
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional: Run-ID von Schritt 55; leer = letzter erfolgreicher Lauf'
        required: false
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  final_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Requests installieren
      run: python -m pip install requests
    - name: Abschlusstest 56 ausfuehren
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: "mkdir -p drafts\ncat > /tmp/the_huddle_56.py <<'PY'\nimport os,io,json,zipfile,requests,re\nfrom datetime import\
        \ datetime,timezone\nNOW=datetime.now(timezone.utc)\nrepo=os.environ[\"GITHUB_REPOSITORY\"]\ntoken=os.environ[\"GITHUB_TOKEN\"\
        ]\nsess=requests.Session()\nheaders={\"Authorization\":\"Bearer \"+token,\"Accept\":\"application/vnd.github+json\"\
        }\ndef api(path,params=None):\n    r=sess.get(\"https://api.github.com\"+path,headers=headers,params=params,timeout=25)\n\
        \    r.raise_for_status()\n    return r.json()\nrid=os.getenv(\"SOURCE_RUN_ID\",\"\").strip()\nif not rid:\n    runs=api(f\"\
        /repos/{repo}/actions/workflows/the-huddle-55.yml/runs\",\n             {\"status\":\"success\",\"per_page\":25}).get(\"\
        workflow_runs\",[])\n    if not runs:raise RuntimeError(\"Kein erfolgreicher Schritt-55-Lauf gefunden.\")\n    rid=str(runs[0][\"\
        id\"])\narts=api(f\"/repos/{repo}/actions/runs/{rid}/artifacts\").get(\"artifacts\",[])\na=next((x for x in arts if\
        \ x[\"name\"]==\"the-huddle-nachrichten-55\" and not x[\"expired\"]),None)\nif not a:raise RuntimeError(\"Schritt-55-Artefakt\
        \ fehlt oder ist abgelaufen.\")\nresp=sess.get(a[\"archive_download_url\"],headers=headers,timeout=40)\nresp.raise_for_status()\n\
        with zipfile.ZipFile(io.BytesIO(resp.content)) as z:\n    data=json.loads(z.read(\"the-huddle-55.json\"))\n\nstories=data.get(\"\
        top_stories\",[])\ngames=[g for g in data.get(\"games\",[]) if g.get(\"completed\")]\naw=data.get(\"austrian_watch\"\
        ,[])\ndef speculative(x):\n    t=(x.get(\"title\",\"\")+\" \"+x.get(\"rss_description\",\"\")).lower()\n    return\
        \ any(w in t for w in (\"could \",\"might \",\"proposal\",\"hypothetical\",\n                               \"trade\
        \ question\",\"rumor\",\"rumour\",\"reportedly\",\n                               \"would \",\"should \",\"prediction\"\
        ))\ndef opinion(x):\n    t=x.get(\"title\",\"\").lower()\n    return any(w in t for w in (\"candidacy\",\"grades\"\
        ,\"ranking\",\"opinion\",\"takeaways\"))\ndef topic(x):\n    t=(x.get(\"title\",\"\")+\" \"+x.get(\"rss_description\"\
        ,\"\")).lower()\n    if \"simmons\" in t:return \"simmons-trade\"\n    if \"colts\" in t or \"quenton nelson\" in\
        \ t:return \"colts\"\n    if \"jack campbell\" in t:return \"campbell-injury\"\n    return re.sub(r\"[^a-z]+\",\"\
        -\",x.get(\"title\",\"\").lower())[:50]\nseen=set();accepted=[];rejected=[]\nfor x in stories:\n    why=None\n   \
        \ if speculative(x):why=\"Spekulation / hypothetischer Transfer\"\n    elif opinion(x):why=\"Analyse oder Meinungsbeitrag,\
        \ keine harte Nachricht\"\n    elif topic(x) in seen:why=\"Doppelte Ereignisgruppe\"\n    if why:rejected.append({\"\
        title\":x.get(\"title\",\"\"),\"reason\":why})\n    else:\n        seen.add(topic(x))\n        accepted.append(x)\n\
        # Austrian Watch: distinct clusters, avoid outdated \"current\" claims.\nawgroups={}\nfor x in aw:\n    k=x.get(\"\
        topic\",\"Sonstiges\")\n    if k.startswith(\"Cardinals\") and not x.get(\"player_named\"):continue\n    awgroups.setdefault(k,[]).append(x)\n\
        awgroups=dict(list(awgroups.items())[:3])\n# Brief is deterministic, explicitly not a synthesized news article.\n\
        latest=sorted(games,key=lambda g:g.get(\"date\",\"\"),reverse=True)\nlines=[\"# THE HUDDLE – Abschlusstest 56\",\"\
        \",\n       \"**REDAKTIONELLER ENTWURF · NICHT FREIGEGEBEN**\",\"\",\n       \"Erstellt: \"+NOW.strftime(\"%d.%m.%Y\
        \ %H:%M UTC\")+\" | Datenbasis: Schritt 55, Run \"+rid,\"\",\n       \"## Die NFL in 60 Sekunden\",\"\"]\nif latest:\n\
        \    g=latest[0];away=g[\"away\"];home=g[\"home\"]\n    lines.append(\"Im Game Center steht als jüngstes abgeschlossenes\
        \ Spiel: \"+\n                 away[\"team\"]+\" \"+str(away[\"score\"])+\" – \"+str(home[\"score\"])+\n         \
        \        \" \"+home[\"team\"]+\".\")\nif accepted:\n    lines.append(\"Für die Nachrichtenredaktion wurden \"+str(len(accepted))+\n\
        \                 \" aktuelle RSS-Meldungen nach einem einfachen Regelcheck ausgewählt. \"+\n                 \"Ihre\
        \ Inhalte sind noch nicht unabhängig überprüft.\")\nif awgroups:\n    lines.append(\"Die Austrian Watch konzentriert\
        \ sich auf Entwicklungen bei den \"+\n                 \"Indianapolis Colts und deren Bedeutung für das Umfeld von\
        \ Bernhard Raimann. \"+\n                 \"Ein unmittelbarer persönlicher Bezug darf nicht ohne Quellenbeleg behauptet\
        \ werden.\")\nlines+=[\"\",\"**Redaktioneller Hinweis:** Dies ist noch kein fertig geschriebener \"+\n        \"60-Sekunden-Brief.\
        \ Die regelbasierte Ausgabe kann Fakten nicht selbstständig \"+\n        \"zuverlässig einordnen oder übersetzen.\"\
        ,\"\",\"## Top Stories – geprüfte Auswahl\",\"\"]\nfor x in accepted:\n    lines+=[\"### \"+x[\"title\"],\"Quelle:\
        \ \"+x.get(\"source\",\"\")+\" – \"+x[\"url\"],\n            \"RSS-Kurzbeschreibung (Originalsprache): \"+x.get(\"\
        rss_description\",\"\"),\n            \"**Offen:** Originalartikel lesen, Fakten prüfen und eigenständig auf Deutsch\
        \ schreiben.\",\"\"]\nif not accepted:lines+=[\"Keine harte Nachricht nach dem Regelcheck verblieben.\",\"\"]\nlines+=[\"\
        ## Ausgeschlossene Meldungen\",\"\"]\nfor x in rejected:lines.append(\"- \"+x[\"title\"]+\" – \"+x[\"reason\"])\n\
        if not rejected:lines.append(\"- Keine\")\nlines+=[\"\",\"## Austrian Watch – Themenbündel\",\"\"]\nfor name,items\
        \ in awgroups.items():\n    lines.append(\"### \"+name)\n    for x in items[:3]:\n        lines.append(\"- \"+x.get(\"\
        title\",\"\")+\" (\"+x.get(\"source\",\"Quelle\")+\n                     \"): \"+x.get(\"url\",\"\"))\n    lines.append(\"\
        **Offen:** Quellenalter und tatsächlichen Raimann-Bezug prüfen.\")\n    lines.append(\"\")\nif not awgroups:lines.append(\"\
        Keine geeigneten Austrian-Watch-Quellen.\")\nlines+=[\"\",\"## Game Center\",\"\"]\nfor g in latest:\n    lines.append(\"\
        - \"+g[\"away\"][\"team\"]+\" \"+str(g[\"away\"][\"score\"])+\n                 \" : \"+str(g[\"home\"][\"score\"\
        ])+\" \"+g[\"home\"][\"team\"]+\n                 \" (Final, \"+g.get(\"date\",\"\")[:10]+\")\")\nlines+=[\"\",\"\
        Quelle: https://www.espn.com/nfl/scoreboard\",\"\",\n        \"## Projektentscheidung: Go / No-Go\",\"\"]\nchecks={\n\
        \    \"mindestens_3_harte_nachrichten\":len(accepted)>=3,\n    \"mindestens_3_nachrichten_mit_beschreibung\":sum(bool(x.get(\"\
        rss_description\")) for x in accepted)>=3,\n    \"austrian_watch_mit_originalquellen\":bool(awgroups),\n    \"game_center_mit_endstaenden\"\
        :bool(latest),\n    \"deutsche_gepruefte_nachrichten\":False,\n    \"vollstaendiger_deutscher_60_sekunden_brief\"\
        :False,\n}\nfor name,passed in checks.items():\n    lines.append(\"- \"+(\"[x]\" if passed else \"[ ]\")+\" \"+name.replace(\"\
        _\",\" \"))\nlines+=[\"\",\n        \"**Entscheidung: NO-GO für automatisches Publizieren.** \"+\n        \"Die Recherche-\
        \ und Ergebnisbausteine sind nutzbar, aber eine vollständig \"+\n        \"deutsche, faktengeprüfte redaktionelle\
        \ Ausgabe wird ohne manuelle \"+\n        \"Bearbeitung oder ein Sprachmodell nicht erzeugt.\",\n        \"\",\n \
        \       \"**Keine automatische Veröffentlichung. Keine OpenAI-API-Aufrufe.**\"]\nos.makedirs(\"drafts\",exist_ok=True)\n\
        with open(\"drafts/the-huddle-56.md\",\"w\",encoding=\"utf-8\") as f:f.write(\"\\n\".join(lines)+\"\\n\")\nout={\"\
        version\":\"56\",\"generated_utc\":NOW.isoformat(),\"source_55_run\":rid,\n     \"accepted_stories\":accepted,\"rejected_stories\"\
        :rejected,\n     \"austrian_watch_clusters\":awgroups,\"games\":latest,\"checks\":checks,\n     \"decision\":\"NO-GO\
        \ automatic publication\",\"approved\":False,\"published\":False,\n     \"openai_api_calls\":0}\nwith open(\"drafts/the-huddle-56.json\"\
        ,\"w\",encoding=\"utf-8\") as f:\n    json.dump(out,f,ensure_ascii=False,indent=2)\nprint(\"Schritt 56: \"+str(len(accepted))+\"\
        \ Nachrichten, \"+\n      str(len(rejected))+\" ausgeschlossen, \"+str(len(latest))+\n      \" Endergebnisse. Automatische\
        \ Publikation: NO-GO.\")\nPY\npython /tmp/the_huddle_56.py"
    - name: Ergebnis sichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: the-huddle-abschlusstest-56
        path: drafts/the-huddle-56.*
        if-no-files-found: warn
        retention-days: 7
