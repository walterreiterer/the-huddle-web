name: THE HUDDLE – automatische Testvorschau
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
permissions:
  contents: write
concurrency:
  group: huddle-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wien 07 Uhr prüfen
        id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Vienna'))
          run=os.environ['EVENT_NAME']=='workflow_dispatch' or now.hour==7
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(run).lower()+'\n')
          print('Wien:',now,'Run:',run)
          PYCODE
      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.time.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Pakete installieren
        if: steps.time.outputs.run == 'true'
        run: pip install requests feedparser trafilatura googlenewsdecoder
      - name: Scores abrufen
        if: steps.time.outputs.run == 'true'
        run: python scripts/fetch_scores.py
      - name: Quellen sammeln
        if: steps.time.outputs.run == 'true'
        run: python scripts/collect_sources_10.py
      - name: Ausgabe erstellen
        if: steps.time.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/build_morning_13.py
      - name: Test-JSON erzeugen
        if: steps.time.outputs.run == 'true'
        run: python scripts/convert_morning_14.py
      - name: Test-JSON prüfen
        if: steps.time.outputs.run == 'true'
        run: python scripts/check_preview.py
      
      - name: Vorschau ins Repository schreiben
        if: steps.time.outputs.run == 'true'
        run: |
          set -e
          cp drafts/morning-preview.json /tmp/huddle-preview.json

          git config user.name 'the-huddle-bot'
          git config user.email 'the-huddle-bot@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Push-Versuch $attempt von 3"

            git fetch origin main
            git checkout -B main origin/main

            mkdir -p data
            cp /tmp/huddle-preview.json data/morning-preview.json
            git add data/morning-preview.json

            if git diff --cached --quiet; then
              echo "Vorschau bereits aktuell."
              exit 0
            fi

            git commit -m 'THE HUDDLE: automatische Testvorschau'

            if git push origin HEAD:main; then
              echo "Testvorschau erfolgreich gespeichert."
              exit 0
            fi

            echo "Push-Konflikt, aktueller Stand wird erneut geladen."
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1

      - name: Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huddle-preview-diagnose
          path: drafts/
          if-no-files-found: ignore
          retention-days: 7
